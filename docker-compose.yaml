services:
  postgres:
    image: postgres:16
    container_name: learnhub-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - learnhub_postgres_data:/var/lib/postgresql/data

volumes:
  learnhub_postgres_data: